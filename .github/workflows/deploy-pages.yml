name: Deploy Pages

# GitHub Pages serves only the Sparkle feed: installed apps fetch
# https://dinhanhthi.github.io/FastMoji/appcast.xml (SUFeedURL).
# Every deploy replaces the whole site; docs/ and the app source are never published.
# Requires Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'appcast.xml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Stage appcast
        run: |
          mkdir _site
          if [ -f appcast.xml ]; then
            cp appcast.xml _site/appcast.xml
          else
            # Before the first release there is no feed yet; publish a placeholder.
            echo '<!doctype html><title>FastMoji</title><p>No release yet.</p>' > _site/index.html
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
